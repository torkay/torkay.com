<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <title>Tor Kay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a12;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Canvas container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* Vignette overlay */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 2;
            opacity: 0;
        }

        /* Ambient particles */
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity;
            filter: blur(0.5px);
        }

        /* Glow behind blob */
        .blob-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%) scale(0);
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(20, 184, 166, 0.2) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(40px);
        }

        /* Shockwave ring */
        .shockwave {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border: 3px solid rgba(168, 85, 247, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            will-change: transform, opacity;
        }

        .shockwave-2 {
            width: 80px;
            height: 80px;
            border: 2px solid rgba(20, 184, 166, 0.8);
        }

        .shockwave-3 {
            width: 60px;
            height: 60px;
            border: 1px solid rgba(249, 115, 22, 0.6);
        }

        /* Screen flash */
        .screen-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.95), rgba(168, 85, 247, 0.3));
            opacity: 0;
            pointer-events: none;
            z-index: 15;
        }

        /* Text container */
        .final-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: baseline;
        }

        .letter {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #14b8a6, #a855f7, #f97316);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            display: inline-block;
            animation: gradientFlow 3s ease-in-out infinite;
            animation-play-state: paused;
        }

        .letter.animate {
            animation-play-state: running;
        }

        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .letter.dot {
            font-size: clamp(2rem, 6vw, 3rem);
            margin: 0 0.05em;
        }

        /* Text glow */
        .text-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 100px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(168, 85, 247, 0.3) 0%, transparent 70%);
            filter: blur(30px);
            pointer-events: none;
            z-index: 9;
            opacity: 0;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .letter {
                opacity: 1;
            }
            .vignette, .particles-container, .blob-glow, .shockwave, .screen-flash, .text-glow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Background glow -->
    <div class="blob-glow" id="blobGlow"></div>

    <!-- Three.js canvas -->
    <div id="canvas-container"></div>

    <!-- Vignette -->
    <div class="vignette" id="vignette"></div>

    <!-- Ambient particles -->
    <div class="particles-container" id="particles"></div>

    <!-- Shockwave rings -->
    <div class="shockwave" id="shockwave1"></div>
    <div class="shockwave shockwave-2" id="shockwave2"></div>
    <div class="shockwave shockwave-3" id="shockwave3"></div>

    <!-- Screen flash -->
    <div class="screen-flash" id="flash"></div>

    <!-- Text glow -->
    <div class="text-glow" id="textGlow"></div>

    <!-- Text with letter spans -->
    <div class="final-text" id="finalText">
        <span class="letter">T</span><span class="letter">o</span><span class="letter">r</span><span class="letter">K</span><span class="letter">a</span><span class="letter">y</span><span class="letter dot">.</span><span class="letter">c</span><span class="letter">o</span><span class="letter">m</span>
    </div>

    <script type="module" src="/src/splash/main.ts"></script>
</body>
</html>

<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <title>Tor Kay</title>
</head>
<body>
    <!-- Background glow -->
    <div class="blob-glow" id="blobGlow"></div>

    <!-- Three.js canvas -->
    <div id="canvas-container"></div>

    <!-- Vignette -->
    <div class="vignette" id="vignette"></div>

    <!-- Ambient particles -->
    <div class="particles-container" id="particles"></div>

    <!-- Shockwave rings -->
    <div class="shockwave" id="shockwave1"></div>
    <div class="shockwave shockwave-2" id="shockwave2"></div>
    <div class="shockwave shockwave-3" id="shockwave3"></div>

    <!-- Screen flash -->
    <div class="screen-flash" id="flash"></div>

    <!-- Text glow -->
    <div class="text-glow" id="textGlow"></div>

    <!-- Text with letter spans -->
    <div class="final-text" id="finalText">
        <span class="letter">T</span><span class="letter">o</span><span class="letter">r</span><span class="letter">K</span><span class="letter">a</span><span class="letter">y</span><span class="letter dot">.</span><span class="letter">c</span><span class="letter">o</span><span class="letter">m</span>
    </div>

    <script type="module" src="/src/splash/main.ts"></script>
</body>
</html>

<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <title>Text Style Comparison</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a12;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .comparison-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            min-height: 100vh;
        }

        .variant {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            backdrop-filter: blur(4px);
        }

        .variant-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .text-sample {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            display: flex;
            align-items: baseline;
        }

        .text-sample .sub {
            font-size: 0.5em;
            font-weight: 500;
            margin-left: 0.1em;
        }

        /* ========== VARIANT 1: Negative (Background Color) ========== */
        .v1 .text-sample {
            color: #0a0a12;
        }

        /* ========== VARIANT 2: White Text ========== */
        .v2 .text-sample {
            color: white;
        }

        /* ========== VARIANT 3: White with Shadow ========== */
        .v3 .text-sample {
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* ========== VARIANT 4: Outline Only ========== */
        .v4 .text-sample {
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.8);
        }

        /* ========== VARIANT 5: Glass Container ========== */
        .v5 .glass-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 32px;
            box-shadow:
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.05),
                0 4px 24px -4px rgba(0, 0, 0, 0.2);
        }
        .v5 .text-sample {
            color: rgba(255, 255, 255, 0.9);
        }

        /* ========== VARIANT 6: Gradient Text ========== */
        .v6 .text-sample {
            background: linear-gradient(135deg, #14b8a6, #a855f7, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ========== VARIANT 7: Subtle Glow ========== */
        .v7 .text-sample {
            color: rgba(255, 255, 255, 0.95);
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(255, 255, 255, 0.2),
                0 0 60px rgba(255, 255, 255, 0.1);
        }

        /* ========== VARIANT 8: Mix Blend Difference ========== */
        .v8 .text-sample {
            color: white;
            mix-blend-mode: difference;
        }

        /* ========== VARIANT 9: Thin White + Thick Dark Outline ========== */
        .v9 .text-sample {
            color: rgba(255, 255, 255, 0.9);
            text-shadow:
                -1px -1px 0 rgba(0, 0, 0, 0.3),
                1px -1px 0 rgba(0, 0, 0, 0.3),
                -1px 1px 0 rgba(0, 0, 0, 0.3),
                1px 1px 0 rgba(0, 0, 0, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* ========== VARIANT 10: Semi-transparent with backdrop ========== */
        .v10 .backdrop-box {
            background: rgba(10, 10, 18, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 16px 32px;
        }
        .v10 .text-sample {
            color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="comparison-grid">
        <div class="variant v1">
            <div class="variant-label">1. Negative (BG Color)</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v2">
            <div class="variant-label">2. White Text</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v3">
            <div class="variant-label">3. White + Shadow</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v4">
            <div class="variant-label">4. Outline Only</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v5">
            <div class="variant-label">5. Glass Container</div>
            <div class="glass-box">
                <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
            </div>
        </div>

        <div class="variant v6">
            <div class="variant-label">6. Gradient Text</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v7">
            <div class="variant-label">7. Subtle Glow</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v8">
            <div class="variant-label">8. Mix-Blend Difference</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v9">
            <div class="variant-label">9. White + Dark Outline</div>
            <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
        </div>

        <div class="variant v10">
            <div class="variant-label">10. Dark Backdrop</div>
            <div class="backdrop-box">
                <div class="text-sample"><span>TorKay</span><span class="sub">.com</span></div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/text-test/main.ts"></script>
</body>
</html>
